server {
    listen 80;
    server_name dizhi.com;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/dizhi.access.log;
    error_log /var/log/nginx/dizhi.error.log;
    location / { try_files $uri $uri/ =404; }
    location ^~ /nginx/ { deny all; }
    location = /compose.yaml { deny all; }
}
